name: CI/CD

on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go test ./...

  build-agent:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: linux
            arch: arm
          - os: linux
            arch: 386
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" == "windows" ]; then
            ext=".exe"
          else
            ext=""
          fi
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} CGO_ENABLED=0 go build -o "dist/jagr-agent-${{ matrix.os }}-${{ matrix.arch }}${ext}" ./cmd/agent
      - uses: actions/upload-artifact@v4
        with:
          name: agent-binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          retention-days: 7

  build-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o dist/jagr-gateway-linux-amd64 ./cmd/gateway
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o dist/jagr-gateway-linux-arm64 ./cmd/gateway
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-binaries
          path: dist/
          retention-days: 7

  build-and-push-docker:
    needs: [build-gateway]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semantic,pattern=v{{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: gateway/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  nightly-build:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: linux
            arch: arm
          - os: linux
            arch: 386
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build agent binaries
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" == "windows" ]; then
            ext=".exe"
          else
            ext=""
          fi
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} CGO_ENABLED=0 go build -o "dist/jagr-agent-${{ matrix.os }}-${{ matrix.arch }}${ext}" ./cmd/agent
      - uses: actions/upload-artifact@v4
        with:
          name: agent-binaries-nightly-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          retention-days: 7
      - name: Build gateway binaries
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o dist/jagr-gateway-linux-amd64 ./cmd/gateway
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o dist/jagr-gateway-linux-arm64 ./cmd/gateway
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push nightly
        uses: docker/build-push-action@v5
        with:
          context: .
          file: gateway/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:nightly,ghcr.io/${{ github.repository }}:latest

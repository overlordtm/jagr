stages:
  - test
  - build
  - publish

variables:
  CGO_ENABLED: "0"

test:
  stage: test
  script:
    - go test ./...
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'

build-agent:
  stage: build
  script:
    - |
      platforms=("linux" "darwin" "windows" "freebsd" "openbsd" "netbsd")
      architectures=("amd64" "arm64" "386" "arm" "ppc64le" "s390x")
      
      for os in "${platforms[@]}"; do
        for arch in "${architectures[@]}"; do
          if [ "$os" == "windows" ]; then
            ext=".exe"
          else
            ext=""
          fi
          GOOS="$os" GOARCH="$arch" go build -o "jagr-agent-${os}-${arch}${ext}" ./cmd/agent
        done
      done
  artifacts:
    paths:
      - jagr-agent-*
    expire_in: 1 week

build-gateway-linux:
  stage: build
  script:
    - |
      GOOS=linux GOARCH=amd64 go build -o jagr-gateway-linux-amd64 ./cmd/gateway
      GOOS=linux GOARCH=arm64 go build -o jagr-gateway-linux-arm64 ./cmd/gateway
  artifacts:
    paths:
      - jagr-gateway-linux-*
    expire_in: 1 week

docker-build-gateway:
  stage: publish
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - |
      docker build -f gateway/Dockerfile -t $GHCR_IMAGE:$CI_COMMIT_TAG .
      docker login -u $GHCR_USERNAME -p $GHCR_TOKEN ghcr.io
      docker push $GHCR_IMAGE:$CI_COMMIT_TAG
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

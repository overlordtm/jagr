server:
  listen: ":8443"
  tls:
    cert: /etc/jagr/server.crt
    key: /etc/jagr/server.key
    # ACME (Let's Encrypt) automatic certificate management
    # When enabled, certificates are obtained and renewed automatically.
    # acme:
    #   enabled: true
    #   email: admin@example.com
    #   domains:
    #     - jagr.example.com
    #   cache_dir: /var/lib/jagr/acme
    #   ca_url: ""  # leave empty for Let's Encrypt production
    #
    # If ACME is not enabled and cert/key files do not exist at the
    # specified paths, a self-signed certificate will be generated
    # automatically.

database:
  path: /var/lib/jagr/jagr.db

rate_limit:
  requests_per_minute: 30
  max_concurrent: 5

session:
  timeout_minutes: 120
  max_tokens_per_session: 500000

# Shared API key that all agents use to authenticate with this gateway.
# Agents identify themselves by hostname, not by key.
agent_api_key: ${JAGR_AGENT_API_KEY}

providers:
  - name: openrouter
    type: openai_compatible
    base_url: https://openrouter.ai/api/v1
    api_key: ${OPENROUTER_API_KEY}
    models:
      - alias: "default"
        upstream: "anthropic/claude-sonnet-4"
        max_context_window: 200000
      - alias: "fast"
        upstream: "anthropic/claude-haiku-4"
        max_context_window: 200000
      - alias: "summarize"
        upstream: "google/gemini-flash-1.5"
        max_context_window: 1000000

  - name: local-ollama
    type: openai_compatible
    base_url: http://localhost:11434/v1
    api_key: ""
    models:
      - alias: "local"
        upstream: "llama3.1:70b"

default_provider: openrouter
default_model: default

dashboard:
  enabled: true
  listen: ":8080"
  # Optional: add users for basic auth. If omitted, no auth required.
  # users:
  #   - username: admin
  #     password: changeme

timeouts:
  provider_timeout_seconds: 300      # upstream LLM provider request timeout
  pricing_fetch_timeout_seconds: 30  # pricing/models metadata fetch timeout

logging:
  level: info
  audit: true

# Knowledge base (RAG) for exercise documentation retrieval.
# When configured, agents can query baseline configs, network maps, and manuals.
# Ingest documents with: jagr-gateway ingest --collection default /path/to/docs/
# knowledge:
#   backend: chromem          # "chromem" (embedded, default) or "redis"
#   data_dir: /var/lib/jagr/knowledge  # persistent storage path (empty = in-memory)
#   embedding:
#     provider: openai_compatible  # "openai", "openai_compatible", "ollama"
#     model: text-embedding-3-small
#     base_url: https://openrouter.ai/api/v1
#     api_key: ${OPENROUTER_API_KEY}

agents:
  # Examples of agent profile configurations
  phase_UserAccess:
    model: "fast"
    temperature: 0.1
    top_p: 0.95
  phase_Persistence:
    model: "default"
    temperature: 0.1
  investigator:
    model: "default"
    temperature: 0.2
    top_k: 40
  reporter:
    model: "default"
    temperature: 0.7
